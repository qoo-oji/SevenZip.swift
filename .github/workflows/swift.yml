name: Swift

# streaming-extract is this fork's working branch (qooViewer pins it by branch +
# revision), so it has to be built and tested here as well as main.
on:
  push:
    branches: [ main, streaming-extract ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ main, streaming-extract ]
    paths-ignore:
      - '*.md'

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
